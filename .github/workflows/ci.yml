name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/nexora?schema=public
          DIRECT_URL: postgresql://user:password@localhost:5432/nexora?schema=public
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/nexora?schema=public
          DIRECT_URL: postgresql://user:password@localhost:5432/nexora?schema=public
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm audit --omit=dev
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/nexora?schema=public
          DIRECT_URL: postgresql://user:password@localhost:5432/nexora?schema=public
